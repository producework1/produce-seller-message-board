<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seller Message Board</title>
<style>
  :root { --bg:#f6f7f4; --card:#fff; --ink:#1c231a; --muted:#6b7263; --line:#e2e6dc; --green:#2f7a3d; --green-d:#25632f; --amber:#b45309; --red:#b91c1c; --accent:#eef5ea; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:640px; margin:0 auto; padding:12px 12px 80px; }
  header.app { background:var(--green); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:10; }
  header.app h1 { margin:0; font-size:1.1rem; }
  header.app .sub { font-size:.8rem; opacity:.9; margin-top:2px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:12px 0; }
  .notice { background:var(--accent); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:.85rem; color:#33402f; margin:12px 0; }
  label { display:block; font-weight:600; font-size:.85rem; margin:10px 0 4px; }
  input[type=text], input[type=password], textarea, select {
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:1rem; background:#fff; color:var(--ink);
  }
  textarea { min-height:84px; resize:vertical; }
  button { background:var(--green); color:#fff; border:none; border-radius:8px; padding:11px 16px; font-size:1rem; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  button.ghost { background:#fff; color:var(--green-d); border:1px solid var(--green); }
  button.danger { background:var(--red); }
  button.small { padding:6px 10px; font-size:.82rem; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .err { color:var(--red); font-size:.9rem; margin-top:8px; }
  .ok { color:var(--green-d); font-size:.9rem; margin-top:8px; }
  .post { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:10px 0; }
  .meta { font-size:.8rem; color:var(--muted); margin-bottom:6px; }
  .badge { display:inline-block; font-size:.72rem; font-weight:700; border-radius:6px; padding:2px 8px; margin-right:6px; }
  .badge.exp { background:#e3f2e6; color:var(--green-d); }
  .badge.con { background:#fdecd3; color:var(--amber); }
  .badge.autohide { background:#fde2e2; color:var(--red); }
  .post .item { font-size:.85rem; color:var(--muted); margin:2px 0 8px; }
  .post .text { white-space:pre-wrap; margin:6px 0; }
  .post img.attached { width:100%; border-radius:8px; margin-top:8px; display:block; cursor:pointer; }
  .post .tools { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  .replies { margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; }
  .reply { background:#f8faf6; border-radius:8px; padding:8px 10px; margin:6px 0; font-size:.9rem; }
  .reply .meta { font-size:.75rem; }
  .hiddenpost { opacity:.85; border-left:4px solid var(--amber); }
  .toolbar { position:sticky; top:64px; background:var(--bg); padding:8px 0; z-index:5; }
  .toolbar .row { gap:8px; }
  .toolbar select, .toolbar input { flex:1; }
  .admintabs { display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; }
  .lock { float:right; }
  .imgpreview { max-width:100%; border-radius:8px; margin-top:8px; }
  dialog { border:none; border-radius:12px; padding:0; max-width:95vw; }
  dialog img { max-width:95vw; max-height:85vh; display:block; border-radius:12px; }
  dialog::backdrop { background:rgba(0,0,0,.7); }
  .foot { text-align:center; color:var(--muted); font-size:.78rem; margin-top:24px; }
  a { color:var(--green-d); }
</style>
</head>
<body>
<header class="app">
  <h1>Seller Message Board</h1>
  <div class="sub">Anonymous produce experiences &amp; concerns</div>
</header>
<div class="wrap" id="app"></div>
<dialog id="lightbox"><img id="lightboxImg" alt="Attached picture"></dialog>

<script>
const $ = sel => document.querySelector(sel);
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');
let token = sessionStorage.getItem('sb_token') || null;
let role = sessionStorage.getItem('sb_role') || null;
let adminTab = 'reported';

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('Request failed (' + r.status + ')'));
  return j;
}
function timeAgo(ts) {
  const d = Date.now() - ts;
  const m = Math.floor(d/60000); if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.floor(m/60); if (h < 24) return h + ' hr ago';
  return Math.floor(h/24) + ' day' + (Math.floor(h/24) === 1 ? '' : 's') + ' ago';
}

// ---------- gate / setup ----------
async function renderGate() {
  const st = await api('GET', '/api/status');
  if (!st.setupComplete) {
    app.innerHTML = `<div class="card">
      <h2>Owner setup</h2>
      <p>First time setup. Choose two codes — keep the owner code private, and share the seller invite code only with your sellers. Nothing is pre-set.</p>
      <label>Owner code (your private master key)</label>
      <input type="password" id="ow" autocomplete="new-password" placeholder="At least 6 characters">
      <label>Seller invite code (you will share this with sellers)</label>
      <input type="password" id="sw" autocomplete="new-password" placeholder="At least 6 characters">
      <div style="margin-top:12px"><button id="go">Create board</button></div>
      <div class="err" id="e"></div>
    </div>`;
    $('#go').onclick = async () => {
      $('#e').textContent = '';
      try { await api('POST', '/api/setup', { ownerCode: $('#ow').value, sellerCode: $('#sw').value }); renderGate(); }
      catch (e2) { $('#e').textContent = e2.message; }
    };
  } else {
    app.innerHTML = `<div class="card">
      <h2>Enter your code</h2>
      <p>Sellers: enter the invite code you were given. Admins and the owner: enter your own code.</p>
      <label>Code</label>
      <input type="password" id="code" autocomplete="current-password" placeholder="Invite code">
      <div style="margin-top:12px"><button id="go">Enter board</button></div>
      <div class="err" id="e"></div>
    </div>`;
    const submit = async () => {
      $('#e').textContent = '';
      try {
        const j = await api('POST', '/api/verify', { code: $('#code').value });
        token = j.token; role = j.role;
        sessionStorage.setItem('sb_token', token); sessionStorage.setItem('sb_role', role);
        renderBoard();
      } catch (e2) { $('#e').textContent = e2.message; }
    };
    $('#go').onclick = submit;
    $('#code').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  }
}

function lockOut() {
  token = null; role = null;
  sessionStorage.removeItem('sb_token'); sessionStorage.removeItem('sb_role');
  renderGate();
}

// ---------- board ----------
let feedPosts = [], q = '', ftype = '';
async function renderBoard() {
  const isAdmin = role === 'admin' || role === 'owner';
  app.innerHTML = `
    <div class="notice"><strong>Anonymous board.</strong> Posts show only as "Anonymous". Posts are automatically removed after 14 days. Keep posts about produce — pictures should be of produce only.</div>
    <div class="row" style="margin-bottom:4px">
      <button class="small ghost lock" onclick="lockOut()">🔒 Lock</button>
      ${isAdmin ? `<button class="small" onclick="renderAdmin()">${role === 'owner' ? 'Owner tools' : 'Admin tools'}</button>` : ''}
    </div>
    <div class="card">
      <h3 style="margin-top:0">New post</h3>
      <label>Type</label>
      <select id="ptype"><option value="experience">Experience</option><option value="concern">Concern</option></select>
      <label>Produce item (optional — add APN)</label>
      <input type="text" id="pitem" maxlength="120" placeholder="e.g. Roma Tomatoes - APN 1234567">
      <label>Your post</label>
      <textarea id="ptext" maxlength="2000" placeholder="Share your experience or concern..."></textarea>
      <label>Picture (optional, one per post)</label>
      <input type="file" id="ppic" accept="image/*">
      <img id="pprev" class="imgpreview" style="display:none" alt="Preview">
      <div style="margin-top:10px"><button id="postbtn">Post anonymously</button></div>
      <div class="err" id="pe"></div>
      <div class="ok" id="pok"></div>
    </div>
    <div class="toolbar">
      <div class="row">
        <input type="text" id="sq" placeholder="Search posts or APN..." value="${esc(q)}">
        <select id="sf" style="max-width:150px">
          <option value="">All</option>
          <option value="experience" ${ftype==='experience'?'selected':''}>Experiences</option>
          <option value="concern" ${ftype==='concern'?'selected':''}>Concerns</option>
        </select>
      </div>
    </div>
    <div id="feed"></div>
    <div class="foot">Everything here is anonymous — no names are stored or shown.</div>`;

  $('#ppic').addEventListener('change', () => {
    const f = $('#ppic').files[0];
    if (!f) { $('#pprev').style.display = 'none'; return; }
    if (f.size > 2 * 1024 * 1024) { $('#pe').textContent = 'Picture is too large. Keep it under 2 MB.'; $('#ppic').value=''; return; }
    const rd = new FileReader();
    rd.onload = () => { $('#pprev').src = rd.result; $('#pprev').style.display = 'block'; };
    rd.readAsDataURL(f);
  });
  $('#postbtn').onclick = async () => {
    $('#pe').textContent = ''; $('#pok').textContent = '';
    const btn = $('#postbtn'); btn.disabled = true;
    try {
      let image = null;
      const f = $('#ppic').files[0];
      if (f) {
        const b64 = await downscaleImage(f);
        image = b64.split(',')[1];
      }
      await api('POST', '/api/posts', { type: $('#ptype').value, produceItem: $('#pitem').value, text: $('#ptext').value, image });
      $('#pitem').value=''; $('#ptext').value=''; $('#ppic').value=''; $('#pprev').style.display='none';
      $('#pok').textContent = 'Posted.';
      await loadFeed();
    } catch (e2) { $('#pe').textContent = e2.message; }
    btn.disabled = false;
  };
  $('#sq').addEventListener('input', () => { q = $('#sq').value; clearTimeout(window.__qt); window.__qt = setTimeout(loadFeed, 350); });
  $('#sf').addEventListener('change', () => { ftype = $('#sf').value; loadFeed(); });
  await loadFeed();
}
window.lockOut = lockOut;

function downscaleImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 1280;
      let w = img.width, h = img.height;
      if (w > max || h > max) { const s = max / Math.max(w, h); w = Math.round(w*s); h = Math.round(h*s); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', 0.82));
      URL.revokeObjectURL(img.src);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

async function loadFeed() {
  const isAdmin = role === 'admin' || role === 'owner';
  let url = '/api/posts?';
  if (q) url += 'q=' + encodeURIComponent(q) + '&';
  if (ftype) url += 'type=' + ftype;
  const j = await api('GET', url);
  feedPosts = j.posts;
  const feed = $('#feed');
  if (!feedPosts.length) { feed.innerHTML = '<div class="card" style="text-align:center;color:var(--muted)">No posts yet. Be the first to share.</div>'; return; }
  feed.innerHTML = feedPosts.map(p => postHtml(p, isAdmin)).join('');
}
function postHtml(p, isAdmin) {
  const badge = p.type === 'experience'
    ? '<span class="badge exp">EXPERIENCE</span>' : '<span class="badge con">CONCERN</span>';
  const ah = p.autoHidden ? '<span class="badge autohide">Auto-hidden</span>' : '';
  const item = p.produceItem ? `<div class="item">Produce: ${esc(p.produceItem)}</div>` : '';
  const img = p.image ? `<img class="attached" src="${esc(p.image)}" alt="Attached picture" onclick="zoomImg('${esc(p.image)}')">` : '';
  const replies = (p.replies||[]).map(r =>
    `<div class="reply"><div class="meta">Anonymous · ${timeAgo(r.createdAt)}</div>${esc(r.text)}</div>`).join('');
  return `<div class="post ${p.hidden && isAdmin ? 'hiddenpost' : ''}" id="post-${p.id}">
    <div class="meta">${badge} ${ah} Anonymous · ${timeAgo(p.createdAt)} ${p.flags ? '· ' + p.flags + ' report' + (p.flags>1?'s':'') : ''}</div>
    ${item}<div class="text">${esc(p.text)}</div>${img}
    <div class="replies" id="replies-${p.id}">${replies}</div>
    <div class="tools">
      <button class="small ghost" onclick="toggleReply('${p.id}')">Reply</button>
      <button class="small ghost" onclick="reportPost('${p.id}')">Report</button>
    </div>
    <div id="replybox-${p.id}" style="display:none;margin-top:8px">
      <textarea id="replytext-${p.id}" maxlength="2000" placeholder="Reply anonymously..."></textarea>
      <div style="margin-top:6px"><button class="small" onclick="sendReply('${p.id}')">Send reply</button></div>
      <div class="err" id="replyerr-${p.id}"></div>
    </div>
  </div>`;
}
window.zoomImg = src => { $('#lightboxImg').src = src; $('#lightbox').showModal(); };
$('#lightbox').addEventListener('click', () => $('#lightbox').close());
window.toggleReply = id => {
  const b = $('#replybox-' + id); b.style.display = b.style.display === 'none' ? 'block' : 'none';
};
window.sendReply = async id => {
  $('#replyerr-' + id).textContent = '';
  try {
    await api('POST', '/api/posts/' + id + '/reply', { text: $('#replytext-' + id).value });
    await loadFeed();
  } catch (e) { $('#replyerr-' + id).textContent = e.message; }
};
window.reportPost = async id => {
  if (!confirm('Report this post to the admins?')) return;
  try {
    const j = await api('POST', '/api/posts/' + id + '/report', {});
    alert(j.autoHidden ? 'Reported. The post is now hidden from the board pending admin review.' : 'Reported. Admins will review it.');
    await loadFeed();
  } catch (e) { alert(e.message); }
};

// ---------- admin ----------
window.renderAdmin = renderAdmin;
async function renderAdmin() {
  const isOwner = role === 'owner';
  app.innerHTML = `
    <div class="row"><button class="small ghost" onclick="backToBoard()">← Back to board</button></div>
    <h2>${isOwner ? 'Owner tools' : 'Admin tools'}</h2>
    <div class="admintabs">
      <button class="small ${adminTab==='reported'?'':'ghost'}" onclick="setAdminTab('reported')">Reported posts</button>
      <button class="small ${adminTab==='invite'?'':'ghost'}" onclick="setAdminTab('invite')">Rotate invite code</button>
      ${isOwner ? `<button class="small ${adminTab==='admins'?'':'ghost'}" onclick="setAdminTab('admins')">Manage admins</button>` : ''}
    </div>
    <div id="adminbody"></div>`;
  await renderAdminTab();
}
window.backToBoard = () => renderBoard();
window.setAdminTab = t => { adminTab = t; renderAdmin(); };

async function renderAdminTab() {
  const body = $('#adminbody');
  const isOwner = role === 'owner';
  if (adminTab === 'reported') {
    const j = await api('GET', '/api/admin/posts');
    const reported = j.posts.filter(p => p.flags > 0 || p.hidden);
    body.innerHTML = reported.length ? reported.map(p => `
      <div class="post ${p.hidden?'hiddenpost':''}">
        <div class="meta">${p.type.toUpperCase()} · Anonymous · ${timeAgo(p.createdAt)} · ${p.flags} report${p.flags>1?'s':''} ${p.autoHidden ? '<span class="badge autohide">Auto-hidden</span>' : (p.hidden ? '<span class="badge autohide">Hidden</span>' : '')}</div>
        ${p.produceItem ? `<div class="item">Produce: ${esc(p.produceItem)}</div>` : ''}
        <div class="text">${esc(p.text)}</div>
        ${p.image ? `<img class="attached" src="${esc(p.image)}" onclick="zoomImg('${esc(p.image)}')" alt="Attached picture">` : ''}
        <div class="tools">
          ${p.autoHidden || p.hidden ? `<button class="small" onclick="adminRestore('${p.id}')">Restore post</button>` : ''}
          ${!p.hidden ? `<button class="small ghost" onclick="adminHide('${p.id}')">Hide</button>` : ''}
          <button class="small danger" onclick="adminDelete('${p.id}')">Delete</button>
        </div>
      </div>`).join('')
      : '<div class="card" style="text-align:center;color:var(--muted)">No reported posts.</div>';
  } else if (adminTab === 'invite') {
    body.innerHTML = `<div class="card">
      <h3 style="margin-top:0">Rotate seller invite code</h3>
      <p style="font-size:.9rem;color:var(--muted)">The old code stops working the moment you set a new one. Share the new code only with your sellers.</p>
      <label>New invite code</label>
      <input type="text" id="newcode" placeholder="At least 6 characters">
      <div style="margin-top:10px"><button id="rotatebtn">Set new invite code</button></div>
      <div class="err" id="ae"></div><div class="ok" id="aok"></div>
    </div>`;
    $('#rotatebtn').onclick = async () => {
      $('#ae').textContent = ''; $('#aok').textContent = '';
      try { await api('POST', '/api/admin/invite', { code: $('#newcode').value }); $('#aok').textContent = 'Invite code rotated. The old code no longer works.'; $('#newcode').value=''; }
      catch (e) { $('#ae').textContent = e.message; }
    };
  } else if (adminTab === 'admins' && isOwner) {
    const j = await api('GET', '/api/admin/admins');
    body.innerHTML = `<div class="card">
      <h3 style="margin-top:0">Admins</h3>
      ${j.admins.length ? j.admins.map(a => `
        <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding:8px 0">
          <div>${esc(a.label || 'Admin')}</div>
          <button class="small danger" onclick="removeAdmin('${a.id}')">Remove</button>
        </div>`).join('') : '<p style="color:var(--muted)">No extra admins yet.</p>'}
      <h4>Add admin</h4>
      <label>Private label (only you see this)</label>
      <input type="text" id="alabel" placeholder="e.g. Maria - produce">
      <label>Admin code (give this to the person)</label>
      <input type="text" id="acode" placeholder="At least 6 characters">
      <div style="margin-top:10px"><button id="addadmin">Add admin</button></div>
      <div class="err" id="ae"></div><div class="ok" id="aok"></div>
    </div>`;
    $('#addadmin').onclick = async () => {
      $('#ae').textContent = ''; $('#aok').textContent = '';
      try { await api('POST', '/api/admin/admins', { code: $('#acode').value, label: $('#alabel').value }); $('#aok').textContent = 'Admin added.'; renderAdminTab(); }
      catch (e) { $('#ae').textContent = e.message; }
    };
  }
}
window.adminHide = async id => { await api('POST', '/api/admin/posts/' + id + '/hide', {}); renderAdminTab(); };
window.adminRestore = async id => { await api('POST', '/api/admin/posts/' + id + '/restore', {}); renderAdminTab(); };
window.adminDelete = async id => { if (!confirm('Delete this post permanently?')) return; await api('POST', '/api/admin/posts/' + id + '/delete', {}); renderAdminTab(); };
window.removeAdmin = async id => { if (!confirm('Remove this admin\'s access?')) return; await api('DELETE', '/api/admin/admins/' + id); renderAdminTab(); };

// ---------- boot ----------
(async () => {
  if (token) { try { await renderBoard(); return; } catch (e) { token = null; } }
  renderGate();
})();
</script>
</body>
</html>
